<div class="form-container">
  <div class="form-card">
    <h2>{{ isEdit ? 'Edit shipping type' : 'New shipping type' }}</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="name">Name *</label>
        <input id="name" type="text" formControlName="name" placeholder="e.g. Express" />
      </div>

      <div class="field">
        <label for="price">Price ($) *</label>
        <input id="price" type="number" min="0" step="1" formControlName="price" placeholder="0.00" />
      </div>

      @if (errorMessage) {
        <p class="error">{{ errorMessage }}</p>
      }

      <div class="actions">
        <button type="button" class="ghost-btn" (click)="cancel()">Cancel</button>
        <button type="submit" class="primary-btn" [disabled]="form.invalid || isSubmitting">
          {{ isEdit ? 'Save changes' : 'Create' }}
        </button>
      </div>
    </form>
  </div>
</div>
